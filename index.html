<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<script>
/* Algunos celulares (Samsung al instalar la página, o con "versión de escritorio" activada)
   dibujan la página como si fuera un computador y todo se ve diminuto.
   Si la página es mucho más ancha que la pantalla real, la agrandamos para que calce. */
(function () {
  var last = 0;
  function fit() {
    var touch = (navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;
    var land = window.innerWidth > window.innerHeight;
    var sw = screen.width || 0, sh = screen.height || 0;
    var phys = land ? Math.max(sw, sh) : Math.min(sw, sh);
    var z = 1;
    var w = window.innerWidth, h = window.innerHeight;
    // 1) la página es mucho más ancha que la pantalla que reporta el celular
    if (touch && phys > 0 && w > phys * 1.25) z = w / phys;
    // 2) pantalla táctil, vertical y alargada como un teléfono, pero "ancha" como tablet: es un teléfono encogido
    if (touch && h > w && h / w > 1.75 && w > 460) z = Math.max(z, w / 400);
    z = Math.round(z * 100) / 100;
    var root = document.documentElement;
    if (z !== last) { last = z; root.style.zoom = z === 1 ? '' : String(z); root.dataset.fit = z; }
    // tamaño real disponible ya ajustado, para que nada se corte abajo ni a los lados
    if (z === 1) { root.style.removeProperty('--fit-w'); root.style.removeProperty('--fit-h'); }
    else { root.style.setProperty('--fit-w', (w / z) + 'px'); root.style.setProperty('--fit-h', (h / z) + 'px'); }
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 250); });
  window.addEventListener('pageshow', fit);
})();
</script>
<meta name="theme-color" content="#070a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Polo Norte">
<title>Línea Directa al Polo Norte</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<meta name="app-version" content="202611150040">
<link rel="stylesheet" href="css/style.css?v=202611150040">
</head>
<body>
<canvas id="sky"></canvas>

<header id="topbar" class="hidden">
  <button id="btn-back" class="tb-btn" aria-label="Volver"><span class="ico" data-icon="back"></span></button>
  <div id="tb-count" class="tb-count"></div>
  <button id="btn-lang" class="tb-btn tb-lang hidden">ES</button>
  <button id="btn-sound" class="tb-btn hidden" aria-label="Sonido"><span class="ico" data-icon="sound"></span></button>
</header>

<main id="app">
  <!-- 1. Teléfono -->
  <!-- 0. Clave mágica -->
  <section id="scr-gate" class="screen active">
    <h1 class="title">🔐 Clave mágica</h1>
    <canvas id="gate-cv" class="stage"></canvas>
    <div class="dialog gate-dialog"><div id="gate-text" class="dialog-text">El Polo Norte está cerrado con un candado mágico…</div></div>
    <div id="gate-slots" class="gate-slots"><i></i><i></i><i></i><i></i></div>
    <div id="gate-pad" class="gate-pad hidden">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="hint" class="hint">💡</button><button data-k="0">0</button><button data-k="del" class="del">←</button>
    </div>
    <button id="gate-start" class="pix-btn big gold gate-start">🎅 ¡Toca para escuchar a Santa!</button>
    <button id="away-dot-gate" class="away-dot" aria-label=" "><span class="ico" data-icon="snow"></span></button>
  </section>

  <!-- 1. Teléfono -->
  <section id="scr-phone" class="screen">
    <div class="logo">
      <div class="logo-top" data-t="title"></div>
      <div class="logo-sub" data-t="subtitle"></div>
    </div>
    <div class="phone-wrap">
      <canvas id="phone-cv" width="220" height="190"></canvas>
      <div id="phone-display" class="phone-display hidden"></div>
    </div>
    <div id="phone-msg" class="blink-text" data-t="tapPhone"></div>
    <button id="btn-parents-phone" class="lock-btn phone-lock" aria-label="Papás"><span class="ico" data-icon="lock"></span></button>
    <button id="away-dot" class="away-dot" aria-label=" "><span class="ico" data-icon="snow"></span></button>
  </section>

  <!-- 2. ¿Quién llama? -->
  <section id="scr-who" class="screen">
    <h1 class="title" data-t="whoCalls"></h1>
    <div class="who-cards">
      <button class="who-card" data-kid="sophie"><span class="who-orn"></span><span class="who-name">Sophie</span></button>
      <button class="who-card" data-kid="alana"><span class="who-orn"></span><span class="who-name">Alana</span></button>
      <button class="who-card who-both" data-kid="both"><span class="who-orn"></span><span class="who-name" data-t="both"></span></button>
    </div>
  </section>

  <!-- 3. Bautizo de los elfos -->
  <section id="scr-naming" class="screen">
    <canvas id="naming-cv" class="stage"></canvas>
    <div class="dialog"><div id="naming-text" class="dialog-text"></div></div>
    <div id="naming-form" class="naming-form hidden">
      <div class="row">
        <button id="naming-mic" class="mic-btn"><span class="ico" data-icon="mic"></span></button>
        <input id="naming-input" class="pix-input" maxlength="16" autocomplete="off">
        <button id="naming-ok" class="pix-btn green" data-t="nameOk"></button>
      </div>
      <div id="naming-ideas" class="chips"></div>
    </div>
    <button id="naming-go" class="pix-btn big hidden">🎄</button>
  </section>

  <!-- 4. Taller (menú principal) -->
  <section id="scr-hub" class="screen">
    <div class="countdown">
      <div id="cd-days" class="cd-days"></div>
      <div id="cd-clock" class="cd-clock"></div>
    </div>
    <div class="workshop-wrap">
      <canvas id="workshop-cv" class="stage"></canvas>
      <div id="elf-tags"></div>
      <div id="hub-bubble" class="bubble hidden"></div>
    </div>
    <nav class="menu">
      <button class="menu-btn" data-go="chat"><canvas data-big="chat"></canvas><span data-t="menuChat"></span></button>
      <button class="menu-btn" data-go="cal"><canvas data-big="calendar"></canvas><span data-t="menuCal"></span><i id="cal-badge" class="badge hidden">!</i></button>
      <button class="menu-btn" data-go="santa"><canvas data-big="santa"></canvas><span data-t="menuSanta"></span></button>
      <button class="menu-btn" data-go="stars"><canvas data-big="star"></canvas><span data-t="menuStars"></span></button>
    </nav>
    <div class="hub-foot">
      <button id="btn-who" class="link-btn"></button>
      <button id="btn-parents" class="lock-btn" aria-label="Papás"><span class="ico" data-icon="lock"></span></button>
    </div>
  </section>

  <!-- 5. Chat -->
  <section id="scr-chat" class="screen mode-voice">
    <div class="seg chat-mode">
      <button data-mode="voice">🎙️ Hablar</button>
      <button data-mode="text">⌨️ Escribir</button>
    </div>
    <div id="chat-tabs" class="chat-tabs"></div>
    <canvas id="chat-cv" class="stage chat-stage"></canvas>
    <div id="chat-log" class="chat-log"></div>
    <div id="call-status" class="call-status hidden"></div>
    <div id="chat-quick" class="chips scroll-x"></div>
    <div class="chat-input">
      <button id="chat-mic" class="mic-btn big"><span class="ico" data-icon="mic"></span><span class="mic-label">Toca y habla</span></button>
      <input id="chat-text" class="pix-input" maxlength="200" autocomplete="off">
      <button id="chat-send" class="pix-btn red send"><span class="ico" data-icon="send"></span></button>
    </div>
  </section>

  <!-- 6. Calendario -->
  <section id="scr-cal" class="screen">
    <h1 class="title" data-t="calTitle"></h1>
    <div id="cal-grid" class="cal-grid"></div>
  </section>

  <!-- 7. Santa -->
  <section id="scr-santa" class="screen">
    <canvas id="santa-cv" class="stage santa-stage"></canvas>
    <div id="santa-letter" class="letter hidden"><div id="santa-text" class="letter-text"></div></div>
    <div id="santa-actions" class="row center hidden">
      <button id="santa-again" class="pix-btn green" data-t="santaAgain"></button>
      <button id="santa-new" class="pix-btn red" data-t="santaNew"></button>
    </div>
  </section>

  <!-- 8. Estrellas -->
  <section id="scr-stars" class="screen">
    <h1 class="title" data-t="starsTitle"></h1>
    <div id="jars" class="jars"></div>
    <div id="stars-list" class="stars-list"></div>
  </section>

  <!-- 9. Papás -->
  <section id="scr-parents" class="screen">
    <div id="parents-root"></div>
  </section>
</main>

<div id="modal" class="modal hidden"><div id="modal-box" class="modal-box"></div></div>
<div id="toast" class="toast hidden"></div>
<canvas id="fx"></canvas>

<script type="module" src="js/app.js?v=202611150040"></script>
</body>
</html>
